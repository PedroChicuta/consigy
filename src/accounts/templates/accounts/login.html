{% extends 'base.html' %}

{% block titulo %}Entrar · Consignado{% endblock %}

{% block conteudo %}
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <h1 class="h3 mb-3">Entrar</h1>
      {% if form.errors %}
        <div class="alert alert-danger" role="alert">Usuário ou senha incorretos.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label" for="{{ form.username.id_for_label }}">Usuário</label>
          <input class="form-control" type="text" name="username" id="{{ form.username.id_for_label }}" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>
          <input class="form-control" type="password" name="password" id="{{ form.password.id_for_label }}" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Entrar</button>
      </form>
    </div>
  </div>
{% endblock %}
