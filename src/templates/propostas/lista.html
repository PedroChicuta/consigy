{% extends 'base.html' %}

{% block titulo %}Propostas · Consignado{% endblock %}

{% block conteudo %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Propostas</h1>
    {% if perms.propostas.add_proposta %}
      <a class="btn btn-primary" href="{% url 'propostas:criar' %}">Nova Proposta</a>
    {% endif %}
  </div>
  <form class="row g-2 mb-3" role="search" action="{% url 'propostas:lista' %}" method="get"
        hx-get="{% url 'propostas:lista' %}" hx-trigger="input changed delay:300ms, change"
        hx-target="#tabela-propostas" hx-swap="outerHTML">
    <div class="col-md-4">
      <input type="search" name="cliente" value="{{ cliente }}" class="form-control" autocomplete="off"
             placeholder="Cliente (nome ou CPF)">
    </div>
    <div class="col-md-4">
      <select name="status" class="form-select">
        <option value="">Todos os status</option>
        {% for valor, rotulo in status_opcoes %}
          <option value="{{ valor }}" {% if valor == status %}selected{% endif %}>{{ rotulo }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <select name="banco" class="form-select">
        <option value="">Todos os Bancos</option>
        {% for b in bancos %}
          <option value="{{ b.pk }}" {% if b.pk|stringformat:'s' == banco %}selected{% endif %}>{{ b.nome }}</option>
        {% endfor %}
      </select>
    </div>
  </form>
  {% include 'propostas/partials/_tabela.html' %}
{% endblock %}
