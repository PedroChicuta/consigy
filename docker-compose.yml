# Desenvolvimento: SQLite + runserver com hot reload
services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    working_dir: /app/src
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/db.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - .:/app
