<!DOCTYPE html>
{% load django_htmx %}
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Consignado{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <nav class="navbar navbar-expand bg-body-tertiary mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">Consignado</a>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'accounts:logout' %}" class="d-flex">
          {% csrf_token %}
          <button class="btn btn-outline-secondary btn-sm" type="submit">Sair</button>
        </form>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% block conteudo %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  {% django_htmx_script %}
</body>
</html>
